<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>قسم السيارات</title>
  <link rel="stylesheet" href="car-selfie.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <a class="back" href="index.html">العودة</a>
      <p class="eyebrow">Car Studio</p>
      <h1>قسم السيارات</h1>
      <p>تم حذف جميع قواعد البرومبت والفيزياء والتحقق والتعليمات الثابتة. بقيت الواجهة فقط.</p>
    </header>

    <section class="card">
      <div class="mode-switch" role="tablist" aria-label="وضع السيارة">
        <button class="mode active" data-mode="inside" type="button">داخل السيارة</button>
        <button class="mode" data-mode="outside" type="button">خارج السيارة</button>
      </div>

      <label for="request">الطلب</label>
      <textarea id="request" rows="10" placeholder="اكتب طلبك يدويًا..."></textarea>

      <label for="output">المخرجات</label>
      <textarea id="output" rows="10" placeholder="لا يوجد محرّك توليد حاليًا. هذه مساحة فارغة." readonly></textarea>

      <div class="actions">
        <button id="clearAll" type="button">مسح</button>
      </div>
    </section>
  </main>
  <script src="car-selfie.js"></script>
</body>
</html>
