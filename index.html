<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prompt Studio بدون قواعد أو قيود تلقائية" />
  <title>Prompt Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">PROMPT STUDIO</p>
        <h1>منشئ Prompt بسيط</h1>
        <p class="intro">لا توجد قواعد تلقائية أو تعليمات سيارة أو Locks. الناتج مبني فقط على اختياراتك وما تكتبه.</p>
      </div>
    </header>

    <section class="workspace">
      <form id="promptForm" class="controls">
        <div class="section-title"><span>01</span><h2>الصورة المرجعية</h2></div>
        <label class="upload-zone" for="referenceImage" id="uploadZone">
          <input id="referenceImage" type="file" accept="image/*" hidden />
          <span class="upload-icon">↑</span>
          <strong>أرفق صورة مرجعية اختياريًا</strong>
          <small id="fileStatus">الصورة تبقى على جهازك ولا تفرض أي قواعد على الـPrompt.</small>
        </label>

        <div class="section-title"><span>02</span><h2>المشهد</h2></div>
        <div class="grid two">
          <label>نوع التصوير
            <select id="captureType">
              <option value="selfie">سيلفي</option>
              <option value="third-person photo">تصوير شخص ثالث</option>
              <option value="mirror selfie">سيلفي مرآة</option>
              <option value="portrait photo">صورة بورتريه</option>
              <option value="candid photo">صورة عفوية</option>
            </select>
          </label>

          <label>وقت المشهد
            <select id="time">
              <option value="morning">الصباح</option>
              <option value="noon">الظهر</option>
              <option value="afternoon">العصر</option>
              <option value="daytime">النهار</option>
              <option value="night">الليل</option>
            </select>
          </label>

          <label>زاوية التصوير
            <select id="angle">
              <option value="natural eye-level angle">طبيعية بمستوى العين</option>
              <option value="slightly low angle">منخفضة قليلًا</option>
              <option value="slightly high angle">مرتفعة قليلًا</option>
              <option value="three-quarter angle">ثلاثة أرباع</option>
              <option value="off-center handheld angle">عفوية خارج المنتصف</option>
            </select>
          </label>

          <label>الوضعية
            <select id="pose">
              <option value="natural relaxed pose">طبيعية ومرتاحة</option>
              <option value="standing">واقف</option>
              <option value="seated">جالس</option>
              <option value="walking">يمشي</option>
              <option value="leaning casually">متكئ</option>
            </select>
          </label>

          <label>التعبير
            <select id="expression">
              <option value="neutral calm expression">محايد وهادئ</option>
              <option value="small closed-mouth smile">ابتسامة خفيفة مغلقة</option>
              <option value="focused expression">تركيز طبيعي</option>
              <option value="thoughtful expression">شرود هادئ</option>
            </select>
          </label>

          <label>نسبة الصورة
            <select id="ratio">
              <option value="9:16 vertical">9:16 عمودي</option>
              <option value="4:5 vertical">4:5 عمودي</option>
              <option value="1:1 square">1:1 مربع</option>
              <option value="16:9 horizontal">16:9 أفقي</option>
            </select>
          </label>

          <label>الموقع
            <select id="place">
              <option value="commercial street">شارع تجاري</option>
              <option value="shopping mall">مول</option>
              <option value="residential villa entrance">مدخل فيلا</option>
              <option value="private home interior">داخل منزل</option>
              <option value="quiet residential neighborhood">حي سكني هادئ</option>
              <option value="gas station">محطة وقود</option>
              <option value="roadside cafeteria">كافتيريا</option>
              <option value="restaurant">مطعم</option>
              <option value="supermarket">سوبرماركت</option>
              <option value="seafront or corniche">كورنيش</option>
              <option value="custom location in notes">موقع مخصص في الملاحظات</option>
            </select>
          </label>
        </div>

        <div class="section-title"><span>03</span><h2>الشخص والمظهر</h2></div>
        <div class="grid two">
          <label>العمر الظاهر<input id="age" value="35" inputmode="numeric" maxlength="3" /></label>
          <label>الشعر
            <select id="hair">
              <option value="same as reference">كما في المرجع</option>
              <option value="natural side sweep">تمشيط جانبي</option>
              <option value="short textured hair">قصير بملمس طبيعي</option>
              <option value="French crop">French crop</option>
              <option value="short wavy hair">متموج قصير</option>
            </select>
          </label>
          <label>الملابس
            <select id="clothing">
              <option value="plain navy shirt and black trousers">قميص كحلي وبنطال أسود</option>
              <option value="plain white T-shirt">تيشيرت أبيض</option>
              <option value="plain black T-shirt">تيشيرت أسود</option>
              <option value="light blue shirt">قميص أزرق فاتح</option>
              <option value="white Saudi thobe">ثوب سعودي أبيض</option>
              <option value="navy Saudi thobe">ثوب سعودي كحلي</option>
              <option value="custom clothing in notes">ملابس مخصصة في الملاحظات</option>
            </select>
          </label>
          <label>النظارة
            <select id="glasses">
              <option value="same as reference">كما في المرجع</option>
              <option value="no glasses">بدون نظارة</option>
              <option value="black rectangular glasses">إطار أسود مستطيل</option>
            </select>
          </label>
        </div>

        <label class="notes">تفاصيل إضافية<textarea id="notes" placeholder="اكتب أي تفاصيل تريدها. لن يضيف التطبيق قواعد من عنده."></textarea></label>
        <div id="warnings" class="warnings" aria-live="polite"></div>
        <button type="submit" class="generate">توليد الـ Prompt <span>↗</span></button>
      </form>

      <aside class="result-panel">
        <div class="result-head"><div><p class="eyebrow">OUTPUT</p><h2>الـ Prompt الناتج</h2></div></div>
        <div class="output-tabs"><button id="copy" type="button">نسخ</button></div>
        <pre id="output" aria-live="polite">اختر الإعدادات ثم اضغط توليد الـ Prompt.</pre>
        <div class="checks"><strong>الحالة</strong><ul id="checklist"><li>لا توجد قواعد تلقائية مفعلة.</li></ul></div>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
